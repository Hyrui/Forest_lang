[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forestlang"
version = "0.3.1"
description = "用中文关键字编写并运行 Python 的森林语言"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Forest Language Contributors" },
]
keywords = [
    "forest-language",
    "chinese",
    "programming-language",
    "python",
    "transpiler",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Natural Language :: Chinese (Simplified)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Software Development :: Interpreters",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "build>=1.0",
    "twine>=5.0",
    "wheel",
]

[project.scripts]
"森林" = "forestlang.__main__:main"
forestlang = "forestlang.__main__:main"

[project.urls]
Homepage = "https://github.com/Hyrui/Forest_lang"
Repository = "https://github.com/Hyrui/Forest_lang"
Issues = "https://github.com/Hyrui/Forest_lang/issues"

[tool.setuptools]
packages = ["forestlang"]
